<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Métricas — CRM Legio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int" data-page="metricas">

  <div class="app" id="app">
    <div class="main">

      <header class="topbar">
        <div class="topbar__title">
          <span data-ico="metricas"></span>
          <h1>Métricas del negocio</h1>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--ghost btn--sm" id="btnCSV"><span data-ico="descargar"></span> Exportar leads</button>
        </div>
      </header>

      <div class="page">
        <div class="toolbar">
          <label class="chip" for="f-periodo">
            <span data-ico="calendario"></span>
            <select id="f-periodo">
              <option value="30">Últimos 30 días</option>
              <option value="90" selected>Últimos 90 días</option>
              <option value="180">Últimos 6 meses</option>
              <option value="365">Último año</option>
              <option value="0">Todo</option>
            </select>
          </label>
        </div>

        <div id="contenido"><div class="int-card int-empty">Calculando…</div></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/crm-charts.js"></script>
  <script src="js/crm-shell.js"></script>
  <script src="js/metricas-ui.js"></script>
</body>
</html>
