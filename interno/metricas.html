<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Métricas — CRM Legio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int">

  <header class="int-top">
    <div class="int-top__inner int-wrap" style="padding-top:0;padding-bottom:0;">
      <div class="int-top__brand">
        <span class="logo-legio">LEGIO</span><span class="logo-sub">Inmobiliaria</span>
        <span class="int-top__tag">Métricas</span>
      </div>
      <div class="int-top__actions">
        <a class="btn btn--ghost btn--sm" href="index.html" style="color:#fff;border-color:rgba(255,255,255,.4);">← Panel</a>
        <button class="btn btn--ghost btn--sm" id="btnLogout" style="color:#fff;border-color:rgba(255,255,255,.4);">Salir</button>
      </div>
    </div>
  </header>

  <main class="int-wrap">
    <div class="int-head">
      <h1>Métricas del negocio</h1>
      <button class="btn btn--ghost btn--sm" id="btnCSV">Exportar leads (CSV)</button>
    </div>

    <div class="crm-filters">
      <div class="form-group">
        <label for="f-periodo">Periodo</label>
        <select id="f-periodo">
          <option value="30">Últimos 30 días</option>
          <option value="90" selected>Últimos 90 días</option>
          <option value="180">Últimos 6 meses</option>
          <option value="365">Último año</option>
          <option value="0">Todo</option>
        </select>
      </div>
    </div>

    <div id="contenido"><div class="int-card int-empty">Calculando…</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/metricas-ui.js"></script>
</body>
</html>
