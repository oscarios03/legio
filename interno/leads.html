<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Prospectos — CRM Legio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int">

  <header class="int-top">
    <div class="int-top__inner int-wrap" style="padding-top:0;padding-bottom:0;">
      <div class="int-top__brand">
        <span class="logo-legio">LEGIO</span><span class="logo-sub">Inmobiliaria</span>
        <span class="int-top__tag">Prospectos</span>
      </div>
      <div class="int-top__actions">
        <a class="btn btn--ghost btn--sm" href="index.html" style="color:#fff;border-color:rgba(255,255,255,.4);">← Panel</a>
        <button class="btn btn--ghost btn--sm" id="btnLogout" style="color:#fff;border-color:rgba(255,255,255,.4);">Salir</button>
      </div>
    </div>
  </header>

  <main class="int-wrap">
    <div class="int-head">
      <h1>Prospectos</h1>
      <div class="int-top__actions">
        <button class="btn btn--ghost btn--sm" id="btnCSV">Exportar CSV</button>
        <button class="btn btn--gold btn--sm" id="btnNuevo">+ Lead manual</button>
      </div>
    </div>

    <div class="crm-filters">
      <div class="form-group">
        <label for="f-buscar">Buscar</label>
        <input type="text" id="f-buscar" placeholder="Nombre, teléfono o correo…" />
      </div>
      <div class="form-group">
        <label for="f-estatus">Estatus</label>
        <select id="f-estatus">
          <option value="">Todos</option>
          <option value="nuevo">Nuevo</option>
          <option value="contactado">Contactado</option>
          <option value="cita">Cita</option>
          <option value="cerrado">Cerrado</option>
          <option value="perdido">Perdido</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-origen">Origen</label>
        <select id="f-origen">
          <option value="">Todos</option>
          <option value="form">Formulario</option>
          <option value="estimador">Estimador</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="manual">Manual</option>
          <option value="referido">Referido</option>
          <option value="portal">Portal</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-asesor">Asesor</label>
        <select id="f-asesor">
          <option value="">Todos</option>
          <option value="sin">Sin asignar</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-urgencia">Pendientes</label>
        <select id="f-urgencia">
          <option value="">Todos</option>
          <option value="sin-contactar">Sin contactar</option>
          <option value="vencidos">Seguimiento vencido</option>
          <option value="hoy">Seguimiento hoy</option>
        </select>
      </div>
    </div>

    <p class="crm-count" id="count"></p>
    <div id="listWrap"><div class="int-card int-empty">Cargando…</div></div>
  </main>

  <!-- Formulario simple de lead manual (oculto por defecto) -->
  <div id="modal" class="crm-modal" style="display:none;">
    <div class="int-card" style="max-width:460px;width:100%;margin:0;" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <h3 class="int-card__title" id="modalTitulo">Nuevo lead manual</h3>
      <div class="form-group"><label for="m-nombre">Nombre *</label><input type="text" id="m-nombre" /></div>
      <div class="int-grid-2">
        <div class="form-group"><label for="m-tel">Teléfono</label><input type="tel" id="m-tel" /></div>
        <div class="form-group"><label for="m-email">Email</label><input type="email" id="m-email" /></div>
      </div>
      <div class="int-grid-2">
        <div class="form-group">
          <label for="m-origen">Origen</label>
          <select id="m-origen">
            <option value="manual">Manual</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="referido">Referido</option>
            <option value="portal">Portal inmobiliario</option>
          </select>
        </div>
        <div class="form-group"><label for="m-ciudad">Ciudad</label><input type="text" id="m-ciudad" /></div>
      </div>
      <div class="form-group"><label for="m-msg">Mensaje / nota</label><textarea id="m-msg" rows="2"></textarea></div>
      <div id="m-dup"></div>
      <div class="int-actions">
        <button class="btn btn--ghost" id="mCancel">Cancelar</button>
        <button class="btn btn--gold" id="mSave">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/leads-ui.js"></script>
</body>
</html>
