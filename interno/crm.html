<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Propiedades — CRM Legio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int" data-page="propiedades">

  <div class="app" id="app">
    <div class="main">

      <header class="topbar">
        <div class="topbar__title">
          <span data-ico="propiedades"></span>
          <h1>Propiedades</h1>
        </div>
        <div class="topbar__actions">
          <a class="btn btn--primary btn--sm" href="propiedad-form.html"><span data-ico="mas"></span> Nueva propiedad</a>
        </div>
      </header>

      <div class="page">
        <div class="crm-filters">
          <div class="form-group">
            <label for="f-buscar">Buscar</label>
            <input type="text" id="f-buscar" placeholder="Título, colonia..." />
          </div>
          <div class="form-group">
            <label for="f-estatus">Estatus</label>
            <select id="f-estatus">
              <option value="">Todos</option>
              <option value="borrador">Borrador</option>
              <option value="disponible">Disponible</option>
              <option value="apartada">Apartada</option>
              <option value="vendida">Vendida</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-ciudad">Ciudad</label>
            <select id="f-ciudad"><option value="">Todas</option></select>
          </div>
          <div class="form-group">
            <label for="f-tipo">Tipo</label>
            <select id="f-tipo">
              <option value="">Todos</option>
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
              <option value="local">Local</option>
              <option value="terreno">Terreno</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-asesor">Captador</label>
            <select id="f-asesor"><option value="">Todos</option></select>
          </div>
          <div class="form-group">
            <label for="f-revision">Revisión</label>
            <select id="f-revision">
              <option value="">Todas</option>
              <option value="pendiente">Por revisar</option>
              <option value="aprobada">Aprobadas</option>
              <option value="devuelta">Devueltas</option>
              <option value="desechada">Desechadas</option>
            </select>
          </div>
        </div>

        <div id="avisoRevision"></div>
        <p class="crm-count" id="count"></p>
        <div id="listWrap"><div class="int-card int-empty">Cargando…</div></div>
      </div>

    </div>
  </div>

  <!-- Dictamen del admin sobre una propiedad -->
  <div id="modalRev" class="crm-modal" style="display:none;">
    <div class="card" style="max-width:480px;width:100%;margin:0;">
      <h3 class="card__title" id="revTitulo">Revisar propiedad</h3>
      <p class="card__desc" id="revSub"></p>
      <div class="form-group">
        <label for="rev-obs">Observaciones para el captador</label>
        <textarea id="rev-obs" rows="3" placeholder="Qué hay que corregir antes de publicarla."></textarea>
        <p class="form-hint" id="revHint"></p>
      </div>
      <div class="int-actions">
        <button class="btn btn--ghost" id="revCancel">Cancelar</button>
        <span style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn--danger" id="revDesechar">Desechar</button>
          <button class="btn btn--ghost" id="revDevolver">Devolver</button>
          <button class="btn btn--primary" id="revAprobar">Aprobar y publicar</button>
        </span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/crm-shell.js"></script>
  <script src="js/crm-list-ui.js"></script>
</body>
</html>
