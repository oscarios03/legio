<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel — CRM Legio Inmobiliaria</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int" data-page="panel">

  <!-- LOGIN -->
  <section class="int-login" id="loginCard" style="display:none;">
    <div class="int-login__logo">
      <div class="side__mark">L</div>
      <b>Legio Inmobiliaria</b>
      <span>CRM interno · acceso de asesores</span>
    </div>
    <div class="crm-config-warn" id="configWarn" style="display:none;">
      Falta configurar la conexión con Supabase. Pega tu <code>URL</code> y <code>anon key</code>
      en <code>interno/js/supabase-config.js</code>.
    </div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="pwd">Contraseña</label>
        <input type="password" id="pwd" placeholder="Tu contraseña" autocomplete="current-password" />
      </div>
      <div class="int-login__error" id="loginError"></div>
      <button type="submit" class="btn btn--primary btn--full">Entrar</button>
    </form>
  </section>

  <!-- PANEL -->
  <div class="app" id="app" style="display:none;">
    <div class="main">

      <header class="topbar">
        <div class="topbar__title">
          <span data-ico="panel"></span>
          <h1>Panel</h1>
        </div>
        <div class="topbar__actions">
          <a class="btn-icono" id="btnPendientes" href="leads.html?urgencia=sin-contactar" title="Pendientes">
            <span data-ico="campana"></span>
            <span class="btn-icono__punto" id="puntoAlerta" hidden></span>
          </a>
          <button class="btn btn--ghost btn--sm" id="btnCSV"><span data-ico="descargar"></span> Exportar</button>
          <a class="btn btn--primary btn--sm" href="leads.html?nuevo=1"><span data-ico="mas"></span> Prospecto</a>
        </div>
      </header>

      <div class="page">
        <p class="crm-count" id="saludo"></p>

        <div class="toolbar">
          <label class="chip" for="f-periodo">
            <span data-ico="calendario"></span>
            <select id="f-periodo">
              <option value="mes" selected>Este mes</option>
              <option value="30">Últimos 30 días</option>
              <option value="mes-1">Mes pasado</option>
              <option value="90">Últimos 90 días</option>
              <option value="anio">Este año</option>
            </select>
          </label>
          <div class="seg" id="segAlcance" hidden>
            <button type="button" class="is-active" data-alcance="oficina">Toda la oficina</button>
            <button type="button" data-alcance="mio">Solo lo mío</button>
          </div>
        </div>

        <div id="contenido"><div class="int-card int-empty">Cargando el panel…</div></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/crm-charts.js"></script>
  <script src="js/crm-shell.js"></script>
  <script src="js/crm-home-ui.js"></script>
</body>
</html>
