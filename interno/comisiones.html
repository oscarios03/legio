<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Comisiones — CRM Legio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int" data-page="comisiones">

  <div class="app" id="app">
    <div class="main">

      <header class="topbar">
        <div class="topbar__title">
          <span data-ico="comisiones"></span>
          <h1>Reporte de comisiones</h1>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--ghost btn--sm" id="btnCSV"><span data-ico="descargar"></span> Exportar CSV</button>
        </div>
      </header>

      <div class="page">
        <div class="crm-filters">
          <div class="form-group"><label for="f-desde">Desde (fecha de venta)</label><input type="date" id="f-desde" /></div>
          <div class="form-group"><label for="f-hasta">Hasta</label><input type="date" id="f-hasta" /></div>
          <div class="form-group"><label for="f-asesor">Asesor</label><select id="f-asesor"><option value="">Todos</option></select></div>
          <div class="form-group" style="flex:0 0 auto;align-self:flex-end;">
            <button class="btn btn--primary btn--sm" id="btnFiltrar">Generar</button>
          </div>
        </div>

        <div class="kpis" id="totales"></div>
        <div id="listWrap"><div class="int-card int-empty">Genera el reporte para ver resultados.</div></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/crm-shell.js"></script>
  <script src="js/comisiones-ui.js"></script>
</body>
</html>
