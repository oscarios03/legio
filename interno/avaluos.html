<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Avalúos — Legio Inmobiliaria (Interno)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2235'/%3E%3Ctext x='50%25' y='54%25' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23c9a24b' text-anchor='middle' dominant-baseline='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="interno.css" />
</head>
<body class="int" data-page="avaluos">

  <!-- LOGIN (solo aplica si AUTH_ENABLED = true en auth.js) -->
  <section class="int-login" id="loginCard" style="display:none;">
    <div class="int-login__logo">
      <div class="side__mark">L</div>
      <b>Legio Inmobiliaria</b>
      <span>Herramienta de avalúos · acceso interno</span>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="pwd">Contraseña del equipo</label>
        <input type="password" id="pwd" placeholder="Ingresa la contraseña" autocomplete="current-password" />
      </div>
      <div class="int-login__error" id="loginError"></div>
      <button type="submit" class="btn btn--primary btn--full">Entrar</button>
    </form>
  </section>

  <div class="app" id="app" style="display:none;">
    <div class="main">

      <header class="topbar">
        <div class="topbar__title">
          <span data-ico="avaluos"></span>
          <h1>Avalúos</h1>
        </div>
        <div class="topbar__actions">
          <input type="file" id="importFile" accept="application/json" style="display:none;" />
          <button class="btn btn--ghost btn--sm" id="btnImport">Importar respaldo</button>
          <button class="btn btn--ghost btn--sm" id="btnExport"><span data-ico="descargar"></span> Exportar respaldo</button>
          <a class="btn btn--primary btn--sm" href="avaluo.html"><span data-ico="mas"></span> Nuevo avalúo</a>
        </div>
      </header>

      <div class="page">
        <div id="modoAviso"></div>
        <p class="crm-count" id="count"></p>
        <div id="listWrap"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/crm-util.js"></script>
  <script src="js/crm-auth.js"></script>
  <script src="js/crm-data.js"></script>
  <script src="js/crm-shell.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dashboard-ui.js"></script>
</body>
</html>
